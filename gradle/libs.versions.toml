[versions]
agp = "9.4.1"
android-compileSdk = "37"
android-minSdk = "23"
android-targetSdk = "37"
androidx-activity = "1.11.0"
androidx-appcompat = "1.7.1"
androidx-core = "1.17.0"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.9.5"
androidx-testExt = "1.3.0"
composeMultiplatform = "1.9.1"
core-splashscreen = "1.0.1"
junit = "4.13.2"
kotlin = "2.4.20"
navigation = "2.9.1"
androidx-navigation-compose = "2.9.5"
kotlinxDatetime = "0.7.1"
firebaseBom = "34.19.0"

#Compose core libs
compose-version = "1.9.1"   # https://developer.android.com/jetpack/androidx/releases/compose-ui
compose-material3 = "1.3.2"
compose-savedstate = "1.3.3"  # https://developer.android.com/jetpack/androidx/releases/savedstate
compose-constraintlayout = "1.1.1"
compose-activity = "1.11.0" # https://developer.android.com/jetpack/androidx/releases/activity
compose-navigation = "2.9.4"

compose-ui-backhandler = "1.9.3"

kotlinx-io-core = "0.8.0"

# Network
ktor = "3.3.1"
# Coroutines
kotlinx-coroutines = "1.10.2"

# DI
koin = "4.1.1"
koinAnnotationsVersion = "2.3.0"

# Serialization
kotlinx-serialization-lson = "1.9.0"
uiTooling = "1.9.4"

#Datastore
datastore = "1.1.7"
litert = "2.0.2"

annotations = "26.0.2-1"

#UI
coil_compose = "3.3.0"

#Paging
paging = "3.3.6"

[libraries]
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "uiTooling" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "core-splashscreen" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation-compose" }
androidx-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
navigation-compose = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io-core" }

# Network
ktor-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
